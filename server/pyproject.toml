[project]
name = "quaderno-server"
version = "0.2.0"
description = "Quadernote API: lessons, verbs and weekly level assessments in Postgres"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "anthropic>=2.11.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/llm/prompts.py" = ["E501"]  # prompt prose, kept as the model reads it

[tool.pytest.ini_options]
testpaths = ["tests"]
