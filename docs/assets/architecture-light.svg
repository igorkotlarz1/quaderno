<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Architecture: laptop and phone reach a FastAPI + Postgres 17 stack on a Dell OptiPlex through Tailscale; nightly pg_dump + restic backups go to Backblaze B2; Claude API comes in M4.">
  <defs>
    <pattern id="quad" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e7e9e3" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="520" rx="18"/></clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#151515" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="520" fill="#fbfbf9"/>
    <rect width="1200" height="520" fill="url(#quad)"/>
    <rect x="0" y="0" width="400.0" height="4" fill="#009246"/><rect x="400.0" y="0" width="400.0" height="4" fill="#ffffff"/><rect x="800.0" y="0" width="400.0" height="4" fill="#ce2b37"/>
    <text x="40" y="52" font-family="'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#151515" text-anchor="start" >How Quadernote fits together</text>
    <text x="40" y="78" font-family="'Schibsted Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#62645f" text-anchor="start" >Two devices, one notebook. Everything lives at home on the OptiPlex; nothing is exposed to the internet.</text>
    <rect x="40" y="120" width="230" height="140" rx="12" fill="#ffffff" stroke="#c8321b" stroke-width="1.6" filter="url(#soft)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" begin="0s" repeatCount="indefinite"/></rect><text x="56" y="146" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="600" fill="#c8321b" text-anchor="start" letter-spacing="1.5">LAPTOP · IN CLASS</text><text x="56" y="172" font-family="'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" text-anchor="start" >React + TS app</text><text x="56" y="196" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >fast typing, Enter ↵</text><text x="56" y="215" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >localStorage cache</text><text x="56" y="234" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >sync every 30 s</text>
    <rect x="40" y="320" width="230" height="140" rx="12" fill="#ffffff" stroke="#c8321b" stroke-width="1.6" filter="url(#soft)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" begin="2s" repeatCount="indefinite"/></rect><text x="56" y="346" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="600" fill="#c8321b" text-anchor="start" letter-spacing="1.5">PHONE · AFTER CLASS</text><text x="56" y="372" font-family="'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" text-anchor="start" >same app, same URL</text><text x="56" y="396" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >fill NULLs, reveal verbs</text><text x="56" y="415" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >localStorage cache</text><text x="56" y="434" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >PWA offline in M3</text>
