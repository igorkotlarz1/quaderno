    <circle cx="978" cy="130" r="5" fill="#1d6b45"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="966" y="134" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#1d6b45" text-anchor="end" >24/7</text>
    <rect x="498" y="152" width="232" height="150" rx="12" fill="#ffffff" stroke="#d9dbd5" stroke-width="1.6" filter="url(#soft)"></rect><text x="514" y="178" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="600" fill="#62645f" text-anchor="start" letter-spacing="1.5">API · :8000</text><text x="514" y="204" font-family="'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" text-anchor="start" >FastAPI</text><text x="514" y="228" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >/api/state  /api/lessons</text><text x="514" y="247" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >serves the built web app</text><text x="514" y="266" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >Alembic on start</text>
    <rect x="750" y="152" width="232" height="150" rx="12" fill="#ffffff" stroke="#d9dbd5" stroke-width="1.6" filter="url(#soft)"></rect><text x="766" y="178" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="600" fill="#62645f" text-anchor="start" letter-spacing="1.5">DB</text><text x="766" y="204" font-family="'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" text-anchor="start" >Postgres 17</text><text x="766" y="228" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >+ pgvector (M8)</text><text x="766" y="247" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >lessons · entries · verbs</text><text x="766" y="266" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >assessments · JSONB extra</text>
