    <rect x="750" y="322" width="232" height="150" rx="12" fill="#ffffff" stroke="#d9dbd5" stroke-width="1.6" filter="url(#soft)"></rect><text x="766" y="348" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="600" fill="#62645f" text-anchor="start" letter-spacing="1.5">VOLUMES</text><text x="766" y="374" font-family="'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" text-anchor="start" >pgdata · ./backups</text><text x="766" y="398" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >restart: unless-stopped</text><text x="766" y="417" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >BIOS AC recovery: on</text><text x="766" y="436" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >127.0.0.1 only</text>
    <rect x="1024" y="152" width="150" height="150" rx="12" fill="#ffffff" stroke="#62645f" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#soft)"></rect><text x="1040" y="178" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="600" fill="#62645f" text-anchor="start" letter-spacing="1.5">M4 · SOON</text><text x="1040" y="204" font-family="'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" text-anchor="start" >Claude API</text><text x="1040" y="228" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >Haiku · Sonnet</text><text x="1040" y="247" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >Opus vision (M6)</text><text x="1040" y="266" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="400" fill="#62645f" text-anchor="start" >cost in llm_calls</text>
