    <text x="375" y="150" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#62645f" text-anchor="middle" >private tailnet</text>
    <text x="375" y="450" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#62645f" text-anchor="middle" >tailscale serve</text>
    <text x="375" y="465" font-family="'IBM Plex Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="400" fill="#62645f" text-anchor="middle" >HTTPS *.ts.net</text>
    <rect x="480" y="108" width="520" height="384" rx="16" fill="#f3f4f1" stroke="#151515" stroke-width="1.6"/>
